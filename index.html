<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>উত্তর ধরলা — সৎ বস্তুনিষ্ঠ ও নির্ভরযোগ্য</title>
<meta name="description" content="উত্তর ধরলা: কুড়িগ্রাম ও নাগেশ্বরীসহ সারা দেশের সৎ, বস্তুনিষ্ঠ ও নির্ভরযোগ্য খবর।">
<link rel="canonical" href="https://uttordharla-create.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="উত্তর ধরলা">
<meta property="og:title" content="উত্তর ধরলা — সৎ বস্তুনিষ্ঠ ও নির্ভরযোগ্য">
<meta property="og:description" content="কুড়িগ্রাম ও নাগেশ্বরীসহ সারা দেশের সৎ, বস্তুনিষ্ঠ ও নির্ভরযোগ্য খবর।">
<meta property="og:image" content="https://uttordharla-create.github.io/logo.png">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><div class="wrap">
  <div class="grid">
    <section>
      <div id="lead"></div>
      <h2 class="sec" id="secTitle">সর্বশেষ খবর</h2>
      <div class="cards" id="cards"></div>
      <div class="empty" id="empty" style="display:none">এই বিভাগে এখনো কোনো খবর নেই।</div>
    </section>
    <aside>
      <div class="box"><h2 class="sec">সর্বশেষ</h2><ol class="list" id="latest"></ol></div>
      <div class="box"><h2 class="sec">বিভাগ</h2><ol class="list" id="cats"></ol></div>
    </aside>
  </div>
</div></main>
<script src="app.js"></script>
<script>
(async () => {
  const cat = new URLSearchParams(location.search).get("cat");
  layoutChrome(cat);
  const all = await loadNews();
  const list = cat ? all.filter(n => n.category === cat) : all;
  if (cat) { $("#secTitle").textContent = cat; document.title = cat + " — উত্তর ধরলা"; }

  if (!list.length) $("#empty").style.display = "block";
  else {
    const f = list[0];
    const a = el("a", { href: articleUrl(f.id) });
    a.append(imgTag(f.image, f.title));
    a.append(el("div", { class: "txt" },
      el("span", { class: "cat-tag", text: f.category }),
      el("h1", { text: f.title }),
      el("p", { text: summaryOf(f) }),
      el("div", { class: "meta", text: bnDate(f.date, true) + " · " + (f.author || "") })));
    $("#lead").append(el("div", { class: "lead" }, a));
    list.slice(1).forEach(n => $("#cards").append(renderCard(n)));
    if (list.length <= 1 && !cat) $("#secTitle").style.display = "none";
  }
  all.slice(0, 8).forEach(n => $("#latest").append(el("li", {}, el("a", { href: articleUrl(n.id), text: n.title }))));
  SITE.categories.forEach(c => $("#cats").append(el("li", {}, el("a", { href: "index.html?cat=" + encodeURIComponent(c), text: c }))));
})();
</script>
</body>
</html>
